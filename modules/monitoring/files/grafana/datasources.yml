apiVersion: 1

# uid는 V1과 동일 (대시보드가 uid로 데이터 소스를 찾음)
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Prometheus scrape_interval과 같게 (작으면 rate 패널이 No data)
      timeInterval: 10s
